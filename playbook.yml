- hosts: terraform-ansible
  tasks:
  - name: Installing python3 and virtualenv.
    apt:
      pkg:
      - python3
      - virtualenv
      update_cache: yes
    become: yes
  - name: Installing dependencies with pip (Django e Django Rest).
    pip:
      virtualenv: /home/ubuntu/files/venv
      name:
        - django
        - djangorestframework